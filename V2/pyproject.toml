[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "resolveai-v2"
version = "0.1.0"
description = "Evidence-driven AI support demo for e-commerce merchant software"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.0,<2.0",
    "fastapi>=0.116,<1.0",
    "httpx>=0.28,<1.0",
    "jieba>=0.42,<1.0",
    "langchain>=1.0,<2.0",
    "langchain-google-genai>=3.0,<5.0",
    "langchain-groq>=1.0,<2.0",
    "langgraph>=1.0,<2.0",
    "langgraph-checkpoint-postgres>=3.0,<4.0",
    "langsmith>=0.4,<1.0",
    "pgvector>=0.4,<1.0",
    "psycopg[binary,pool]>=3.2,<4.0",
    "pydantic>=2.11,<3.0",
    "python-dotenv>=1.1,<2.0",
    "PyYAML>=6.0,<7.0",
    "rank-bm25>=0.2,<1.0",
    "torch>=2.8,<3.0",
    "transformers>=4.51,<5.0",
    "uvicorn>=0.35,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<9.0",
    "ruff>=0.12,<1.0",
]

[project.scripts]
resolveai = "backend.app.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 200
target-version = "py311"

[tool.setuptools.packages.find]
include = ["backend*", "simulator*"]
