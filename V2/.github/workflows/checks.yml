name: checks

on:
  push:
    paths:
      - "V2/**"
  pull_request:
    paths:
      - "V2/**"

jobs:
  behavior:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: V2
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: resolveai
          POSTGRES_USER: resolveai
          POSTGRES_PASSWORD: resolveai-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U resolveai -d resolveai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://resolveai:resolveai-test@127.0.0.1:5432/resolveai
      OPENROUTER_API_KEY: test-only
      OPENROUTER_MODEL: test-model
      OPENROUTER_PROVIDER: test-provider
      OPENROUTER_RETRY_PROVIDER: test-retry-provider
      OPENROUTER_FALLBACK_MODEL: test-fallback-model
      OPENROUTER_FALLBACK_PROVIDER: test-fallback-provider
      EMBEDDING_API_KEY: test-only
      EMBEDDING_MODEL: embedding-test-only
      EMBEDDING_DIMENSION: "1024"
      RERANK_MODEL: rerank-test-only
      RETRIEVAL_MODE: vector_only
      LANGSMITH_TRACING: "false"
      LANGSMITH_PROJECT: resolveai-v2-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: V2/requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: V2/frontend/package-lock.json
      - run: python -m pip install -r requirements.lock
      - run: python -m pytest
      - run: python -m ruff check backend simulator evals tests
      - run: npm ci
        working-directory: V2/frontend
      - run: npm run build
        working-directory: V2/frontend
