name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: resolveai
          POSTGRES_USER: resolveai
          POSTGRES_PASSWORD: resolveai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U resolveai -d resolveai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://resolveai:resolveai@localhost:5432/resolveai
      GROQ_API_KEY: test-key
      GROQ_MODEL: openai/gpt-oss-20b

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Check Python code
        run: python -m ruff check --config backend/pyproject.toml backend/app backend/tests simulator evals

      - name: Run migrations
        working-directory: backend
        run: python -m alembic upgrade head

      - name: Check migrations
        working-directory: backend
        run: python -m alembic check

      - name: Run Python tests
        run: python -m pytest backend/tests simulator/tests -q

      - name: Run low-cost agent evaluation smoke check
        run: python evals/run_evaluations.py --validate-only

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v6

      - name: Build backend image
        run: docker build -f backend/Dockerfile -t resolveai-backend:test .

      - name: Build simulator image
        run: docker build -f simulator/Dockerfile -t resolveai-simulator:test .

      - name: Build frontend image
        run: docker build -f frontend/Dockerfile --build-arg VITE_BACKEND_URL=http://127.0.0.1:8000 -t resolveai-frontend:test .
